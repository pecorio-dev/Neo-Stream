# Config Codemagic principale (racine du repo).
# Le projet Flutter vit dans app/app -> working_directory est mis dans chaque workflow.
# app/app/codemagic.yaml contient la meme config (copie de secours).
workflows:
  android-workflow:
    name: Android Release
    working_directory: app/app
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: eu.neostream.neo_stream
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - stream2free.pecorio@gmail.com

  ios-workflow:
    name: iOS Development
    working_directory: app/app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # Groupe d'environnement a creer dans Codemagic (Teams > Integrations > Environment) :
        #   SSH_KEY_SIGNER_B64 = la cle privee en base64 (une seule ligne, secure) - METHODE RECOMMANDEE
        #   (ou SSH_KEY_SIGNER = la cle privee brute multi-lignes)
        - signing_server
      vars:
        PACKAGE_NAME: eu.neostream.neoStream
        SIGNER_USER: root
        SIGNER_HOST: 82.165.188.202
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build unsigned iOS app and package IPA
        script: |
          set -e
          flutter build ios --release --no-codesign
          mkdir -p build/ios/unsigned/Payload
          cp -r build/ios/iphoneos/*.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qr ../unsigned.ipa Payload
          cd -
          echo "--- IPA produit : ---"
          ls -la build/ios/unsigned.ipa
      - name: Send unsigned IPA to the signing server
        script: |
          set -e
          IPA=build/ios/unsigned.ipa
          [ -f "$IPA" ] || IPA=$(find build -name "*.ipa" | head -1)
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "ERREUR: aucun .ipa trouve - le build iOS n'en a pas produit"
            exit 1
          fi
          if [ -n "$SSH_KEY_SIGNER_B64" ]; then
            echo "$SSH_KEY_SIGNER_B64" | base64 -d > /tmp/signer_key
          elif [ -n "$SSH_KEY_SIGNER" ]; then
            echo "$SSH_KEY_SIGNER" | sed -e 's/\r$//' -e 's/\\n/\n/g' > /tmp/signer_key
          else
            echo "ERREUR: definissez SSH_KEY_SIGNER_B64 dans le groupe Codemagic 'signing_server'"
            exit 1
          fi
          chmod 600 /tmp/signer_key
          head -1 /tmp/signer_key
          head -1 /tmp/signer_key | grep -q "BEGIN OPENSSH PRIVATE KEY" || { echo "ERREUR: format de cle SSH invalide"; exit 1; }
          scp -i /tmp/signer_key -o StrictHostKeyChecking=no "$IPA" "$SIGNER_USER@$SIGNER_HOST:/opt/ipa-signer/inbox/"
          rm -f /tmp/signer_key
          echo "IPA envoye : le serveur le signe, resultat dans /opt/ipa-signer/output/"
    artifacts:
      - build/ios/unsigned.ipa
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - stream2free.pecorio@gmail.com