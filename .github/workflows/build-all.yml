name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable

      - name: Get dependencies
        working-directory: app/app
        run: flutter pub get

      - name: Build APK
        working-directory: app/app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoStream-Android-APK
          path: app/app/build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libgtk-3-dev ninja-build cmake clang pkg-config

      - name: Get dependencies
        working-directory: app/app
        run: flutter pub get

      - name: Build Linux
        working-directory: app/app
        run: flutter build linux --release

      - name: Create AppImage
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          APPDIR="/tmp/NeoStream.AppDir"
          BUNDLE="app/app/build/linux/x64/release/bundle"

          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE"/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/neo-stream.desktop" << 'EOF'
          [Desktop Entry]
          Name=Neo Stream
          Exec=neo_stream
          Icon=neo-stream
          Type=Application
          Categories=AudioVideo;Video;Player;
          Comment=Films, Séries, Anime & TV en Direct
          EOF
          sed -i 's/^          //' "$APPDIR/neo-stream.desktop"

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/neo_stream" "$@"
          EOF
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          cp app/app/web/favicon.png "$APPDIR/neo-stream.png" 2>/dev/null || touch "$APPDIR/neo-stream.png"

          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" Neo-Stream-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NeoStream-Linux-AppImage
          path: Neo-Stream-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        working-directory: app/app
        run: flutter pub get

      - name: Build Windows release
        working-directory: app/app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        working-directory: app
        run: iscc neo_stream_setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NeoStream-Windows-Setup
          path: app/installer/NeoStream-Setup-*.exe
