# JVM : heap plus généreux pour R8/full mode (sinon OOM au shrink)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
# Build parallèle : modules/plugins indépendants compilés en même temps
org.gradle.parallel=true
org.gradle.workers.max=3
org.gradle.configureondemand=true
org.gradle.caching=true

# AndroidX — jetifier désactivé (toutes les dépendances Flutter sont déjà AndroidX)
android.useAndroidX=true
android.enableJetifier=false

# R8 full mode (défaut AGP 8+) : optimisation agressive, suppression code mort
android.enableR8.fullMode=true

# Flags ajoutés par le migrateur Flutter
android.builtInKotlin=false
android.newDsl=false

# Cache des ressources non-transitives (build plus rapide, APK plus petit)
android.nonTransitiveRClass=true
android.nonFinalResIds=true
